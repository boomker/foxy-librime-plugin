name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "Comma-separated ABIs (empty = all ABIs plus universal)"
        required: false
        default: ""

permissions:
  contents: read

# Required repository secrets for signed release builds:
#   KEYSTORE_BASE64     base64 of the .jks file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# Without them, release APKs are built unsigned.
env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"
  BUILD_TOOLS_VERSION: "36.0.0"
  KEYSTORE_FILE: ${{ github.workspace }}/release.jks
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install NDK, CMake, and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "platforms;android-36"

      - name: Write local.properties
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'rime.ndkVersion=%s\n' "$NDK_VERSION" >> local.properties
          printf 'rime.cmakeVersion=%s\n' "$CMAKE_VERSION" >> local.properties
          printf 'rime.buildToolsVersion=%s\n' "$BUILD_TOOLS_VERSION" >> local.properties

      - name: Cache Boost source
        uses: actions/cache@v4
        with:
          path: boost_1_89_0.tar.gz
          key: boost-1.89.0

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "KEYSTORE_BASE64 is not set; release APK will be unsigned."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug and release APKs
        env:
          BUILD_ABIS: ${{ inputs.abis }}
        run: |
          if [ -n "$BUILD_ABIS" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon -PbuildABI="$BUILD_ABIS"
          else
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rime-plugin-template
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
